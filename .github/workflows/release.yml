# Release — build VaultClip.dmg and publish a GitHub Release when a version tag is pushed.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  SWIFTLINT_VERSION: "0.65.1"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install SwiftLint (pinned)
        run: |
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          mkdir -p "$HOME/bin"
          unzip -o /tmp/swiftlint.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/swiftlint"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          swiftlint version

      - name: SwiftLint
        run: swiftlint lint --quiet --baseline .swiftlint-baseline.yml

      - name: Verify tag matches MARKETING_VERSION
        if: github.event_name != 'workflow_dispatch'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          versions="$(grep -o 'MARKETING_VERSION = [^;]*;' VaultClip.xcodeproj/project.pbxproj | awk '{print $3}' | tr -d ';' | sort -u | sed '/^$/d')"
          count="$(printf '%s\n' "$versions" | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "MARKETING_VERSION must resolve to a single value, found:" >&2
            echo "$versions" >&2
            exit 1
          fi
          if [ "$tag" != "$versions" ]; then
            echo "Tag version '$tag' does not match MARKETING_VERSION '$versions'" >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches MARKETING_VERSION $versions"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERTIFICATE_P12:-}" ]; then
            echo "No MACOS_CERTIFICATE_P12 secret — skipping certificate import (ad-hoc DMG)."
            exit 0
          fi
          chmod +x ./scripts/import-macos-certificate.sh
          ./scripts/import-macos-certificate.sh

      - name: Run unit tests
        run: |
          chmod +x scripts/run-unit-tests.sh
          ./scripts/run-unit-tests.sh

      - name: Build Release
        run: |
          xcodebuild \
            -project VaultClip.xcodeproj \
            -scheme VaultClip \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create DMG
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          SIGNED=$(mktemp -d)
          COPYFILE_DISABLE=1 ditto --norsrc DerivedData/Build/Products/Release/VaultClip.app "$SIGNED/VaultClip.app"
          chmod +x ./codesign-app.sh
          if [ -n "$MACOS_CERTIFICATE_P12" ]; then
            export VAULTCLIP_SIGN_RELEASE=1
          fi
          ./codesign-app.sh "$SIGNED/VaultClip.app"
          rm -rf dmg-staging VaultClip.dmg
          mkdir dmg-staging
          COPYFILE_DISABLE=1 ditto --norsrc "$SIGNED/VaultClip.app" dmg-staging/VaultClip.app
          ( cd dmg-staging && ../create-installer.sh VaultClip && mv VaultClip.dmg .. )
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            chmod +x ./notarize-dmg.sh
            ./notarize-dmg.sh VaultClip.dmg
          elif [ "${VAULTCLIP_SIGN_RELEASE:-}" = "1" ]; then
            echo "Signed with Developer ID; notarization skipped (set APPLE_ID secrets to enable)."
          else
            echo "Warning: ad-hoc DMG — Accessibility will not work reliably. Add MACOS_CERTIFICATE_P12 secret."
          fi
          ls -lh VaultClip.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VaultClip-${{ github.ref_name }}
          path: VaultClip.dmg
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: VaultClip ${{ github.ref_name }}
          generate_release_notes: true
          files: VaultClip.dmg
