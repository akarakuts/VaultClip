# CI — build, lint, and test on pushes to master and pull requests.

name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --lenient --baseline .swiftlint-baseline.yml --reporter github-actions-logging

      - name: Build Release
        run: |
          xcodebuild \
            -project VaultClip.xcodeproj \
            -scheme VaultClip \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          chmod +x scripts/run-unit-tests.sh scripts/check-coverage.sh
          ./scripts/run-unit-tests.sh
          ./scripts/check-coverage.sh
