# CI — build, lint, and test on pushes to master and pull requests.

name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  # Pinned so the lint baseline (generated with 0.65.1) stays authoritative.
  SWIFTLINT_VERSION: "0.65.1"

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install SwiftLint (pinned)
        run: |
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          mkdir -p "$HOME/bin"
          unzip -o /tmp/swiftlint.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/swiftlint"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          swiftlint version

      - name: SwiftLint
        run: swiftlint lint --lenient --baseline .swiftlint-baseline.yml --reporter github-actions-logging

      - name: Check version consistency
        run: |
          versions="$(grep -o 'MARKETING_VERSION = [^;]*;' VaultClip.xcodeproj/project.pbxproj | awk '{print $3}' | tr -d ';' | sort -u | sed '/^$/d')"
          count="$(printf '%s\n' "$versions" | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "MARKETING_VERSION must resolve to a single value, found:" >&2
            echo "$versions" >&2
            exit 1
          fi
          echo "MARKETING_VERSION = $versions"

      - name: Build Release
        run: |
          xcodebuild \
            -project VaultClip.xcodeproj \
            -scheme VaultClip \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          chmod +x scripts/run-unit-tests.sh scripts/check-coverage.sh
          ./scripts/run-unit-tests.sh
          ./scripts/check-coverage.sh

  tsan:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Unit tests with Thread Sanitizer
        run: |
          xcodebuild test \
            -project VaultClip.xcodeproj \
            -scheme "VaultClip XCTest" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath /tmp/vc-tsan \
            -only-testing:VaultClipTests \
            -parallel-testing-enabled NO \
            -enableThreadSanitizer YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
